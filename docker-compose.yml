services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-omnichat}
      POSTGRES_USER: ${POSTGRES_USER:-omnicart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DENSE: ${DOCKER_INSTALL_DENSE:-false}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # An explicit container URL can point to an existing PostgreSQL instance.
      # Otherwise build the URL safely from components (passwords may contain @/:).
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      DATABASE_REQUIRE_POSTGRES: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-omnicart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-omnichat}
      PORT: "8000"
      HF_HOME: /app/cache/huggingface
      RAG_DENSE_ENABLED: ${DOCKER_INSTALL_DENSE:-false}
    ports:
      - "${DOCKER_BIND_HOST:-127.0.0.1}:${DOCKER_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
      - model-cache:/app/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  # Retain the previous SQLite volume for backups; it is no longer active.
  app-data:
  model-cache:
