# Render does not deploy docker-compose.yml. This Blueprint connects the Docker
# web service directly to managed PostgreSQL on the same private network.
services:
  - type: web
    name: omnicart-ai
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnicart-postgres
          property: connectionString
      - key: DATABASE_REQUIRE_POSTGRES
        value: "true"
      - key: RAG_DENSE_ENABLED
        value: "false"
      - key: EMBEDDING_ALLOW_DOWNLOAD
        value: "false"
      - key: MCP_ENABLED
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: SHOP_ID
        value: shop_01
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_CHAT_API_KEY
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      # Free embedding service on a private Hugging Face Space (see
      # scripts/deploy_hf_space.py). Keyword search is used while disabled.
      - key: EMBEDDING_SERVICE_ENABLED
        value: "false"
      - key: EMBEDDING_SERVICE_URL
        sync: false
      - key: EMBEDDING_SERVICE_API_KEY
        sync: false
      - key: EMBEDDING_SERVICE_TIMEOUT
        value: "5"
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false

databases:
  - name: omnicart-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: omnichat
    user: omnicart
    ipAllowList: []
